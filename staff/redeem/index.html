<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exchange Coffee — Staff Redemption</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5efe7;
            color: #2f241d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-small {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .brand-name {
            margin-top: 8px;
            font-family: Georgia, serif;
            font-size: 30px;
        }

        .card {
            background: #fffaf4;
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 12px 35px rgba(60, 40, 20, 0.10);
        }

        h1 {
            margin: 0 0 8px;
            font-family: Georgia, serif;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 28px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            color: #6e6258;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            border: 1px solid #d8cabc;
            background: white;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #8c6b52;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            background: #2f241d;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 15px;
            line-height: 1.5;
            display: none;
        }

        .success {
            display: block;
            background: #e9f4e9;
            color: #285c32;
        }

        .error {
            display: block;
            background: #f9e7e4;
            color: #8a3328;
        }

        .reward-result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            background: #f1e6d8;
            text-align: center;
            display: none;
        }

        .reward-result .title {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .reward-result .reward {
            margin-top: 8px;
            font-family: Georgia, serif;
            font-size: 26px;
            font-weight: bold;
        }

        .reward-result .code {
            margin-top: 14px;
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 2px;
            word-break: break-all;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: #8a7d72;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <div class="brand-small">
            Exchange Coffee & Roaster
        </div>

        <div class="brand-name">
            Staff Redemption
        </div>
    </div>

    <div class="card">

        <h1>Redeem Reward</h1>

        <p class="subtitle">
            Enter the customer's anniversary reward code
            and staff PIN.
        </p>

        <label for="rewardToken">
            Reward Code
        </label>

        <input
            id="rewardToken"
            type="text"
            placeholder="Enter reward code"
            autocomplete="off"
        >

        <label for="staffPin">
            Staff PIN
        </label>

        <input
            id="staffPin"
            type="password"
            placeholder="Enter staff PIN"
            inputmode="numeric"
            autocomplete="off"
        >

        <button id="redeemButton">
            Redeem Reward
        </button>

        <div id="status" class="status"></div>

        <div id="rewardResult" class="reward-result">

            <div class="title">
                Redeemed Successfully
            </div>

            <div class="reward" id="rewardType">
                BUY ONE GET ONE
            </div>

            <div class="code" id="confirmedCode"></div>

        </div>

    </div>

    <div class="footer">
        Exchange Coffee & Roaster · Staff Only
    </div>

</div>

<script>

const SUPABASE_FUNCTION_URL =
    "https://wbjwcavloaqlsuzyskug.supabase.co/functions/v1/redeem-reward";

const rewardTokenInput =
    document.getElementById("rewardToken");

const urlParams =
    new URLSearchParams(window.location.search);

const codeFromURL =
    urlParams.get("code");

if (codeFromURL) {
    rewardTokenInput.value =
        codeFromURL.trim().toUpperCase();
}

const staffPinInput =
    document.getElementById("staffPin");

const redeemButton =
    document.getElementById("redeemButton");

const statusBox =
    document.getElementById("status");

const rewardResult =
    document.getElementById("rewardResult");

const rewardType =
    document.getElementById("rewardType");

const confirmedCode =
    document.getElementById("confirmedCode");


function showStatus(message, type) {

    statusBox.textContent = message;

    statusBox.className =
        "status " + type;
}


function resetResult() {

    statusBox.className = "status";
    statusBox.textContent = "";

    rewardResult.style.display = "none";
}


redeemButton.addEventListener("click", async () => {

    resetResult();

    const rewardToken =
        rewardTokenInput.value.trim();

    const staffPin =
        staffPinInput.value.trim();


    if (!rewardToken) {

        showStatus(
            "Please enter the reward code.",
            "error"
        );

        return;
    }


    if (!staffPin) {

        showStatus(
            "Please enter the staff PIN.",
            "error"
        );

        return;
    }


    redeemButton.disabled = true;

    redeemButton.textContent =
        "Checking...";


    try {

        const response =
            await fetch(
                SUPABASE_FUNCTION_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        reward_token:
                            rewardToken,

                        staff_pin:
                            staffPin
                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            showStatus(
                result.error ||
                "Redemption failed.",
                "error"
            );

            return;
        }


        showStatus(
            "Reward redeemed successfully.",
            "success"
        );


        rewardType.textContent =
            result.reward.reward_type
                .replaceAll("_", " ")
                .toUpperCase();


        confirmedCode.textContent =
            result.reward.reward_token;


        rewardResult.style.display =
            "block";


        rewardTokenInput.value = "";
        staffPinInput.value = "";

    } catch (error) {

        console.error(error);

        showStatus(
            "Could not connect to the redemption system.",
            "error"
        );

    } finally {

        redeemButton.disabled = false;

        redeemButton.textContent =
            "Redeem Reward";
    }

});

</script>

</body>
</html>
